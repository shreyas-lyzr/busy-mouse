notes: >-
  Single-declaration edit only: line 20's body background changed from
  linear-gradient(135deg, #667eea 0%, #764ba2 100%) to
  linear-gradient(135deg, #2563eb 0%, #1e3a8a 100%). Structure
  (linear-gradient(135deg, ... 0%, ... 100%)) preserved exactly, satisfying
  AC-2. No other line touched — verified via `git diff --stat` (1 file, 1
  changed line) and `grep -i '667eea|764ba2' index.html` (no matches, old
  purple stops fully removed), satisfying AC-1 and AC-4.

  Color choice and legibility reasoning (AC-3): chose #2563eb (a saturated
  mid/royal blue, "blue-600"-ish) as the 0% stop and #1e3a8a (a deep
  navy, "blue-900"-ish) as the 100% stop, per the two-pager's own suggested
  "mid blue to deeper/navy blue" example. Both stops are clearly on the blue
  hue with no red/magenta component, so no purple/violet cast remains, and
  the pair is dark/saturated enough (average luminance well below white) that:
  (1) the un-touched .trail-dot colors, rgba(59,130,246,0.8) ("blue-500") and
  rgba(147,197,253,0.8) ("blue-300", pale/light), both stay visibly lighter
  and more saturated/differently-toned than the background at every point
  along the diagonal, so the dots do not blend in; (2) all white foreground
  elements (mouse body, ears, tail, h1 text, .info text, busy-indicator ring)
  keep strong contrast since white against a #2563eb-#1e3a8a range has a
  large luminance delta; (3) #333 eyes and #ff6b9d nose sit on the white
  mouse body, not directly on the background, so their contrast is unaffected
  by this change. No build system or automated test suite exists in this
  repo (confirmed via two-pager), so verification was static/visual via diff
  and grep rather than a test runner; I did not fabricate a pytest run since
  none applies here.
