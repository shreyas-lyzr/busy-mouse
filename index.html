<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busy Mouse</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            display: flex;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .left-container {
            width: 50%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .mouse-section {
            text-align: center;
        }

        .right-container {
            width: 50%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        h1 {
            color: white;
            margin-bottom: 40px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .busy-mouse-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto;
        }

        /* Main mouse body */
        .mouse-body {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 100px;
            background: #fff;
            border-radius: 40px 40px 50px 50px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        /* Mouse ear - left */
        .ear-left {
            position: absolute;
            top: 10px;
            left: 15px;
            width: 20px;
            height: 30px;
            background: #fff;
            border-radius: 50% 50% 40% 40%;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        /* Mouse ear - right */
        .ear-right {
            position: absolute;
            top: 10px;
            right: 15px;
            width: 20px;
            height: 30px;
            background: #fff;
            border-radius: 50% 50% 40% 40%;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        /* Mouse eyes */
        .eye {
            position: absolute;
            top: 35px;
            width: 8px;
            height: 8px;
            background: #333;
            border-radius: 50%;
        }

        .eye-left {
            left: 25px;
        }

        .eye-right {
            right: 25px;
        }

        /* Mouse nose */
        .nose {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 6px;
            background: #ff6b9d;
            border-radius: 50%;
        }

        /* Busy indicator - spinning circle */
        .busy-indicator {
            position: absolute;
            top: -10px;
            right: -10px;
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-right: 3px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        /* Cursor trail effect */
        .trail {
            position: absolute;
            top: 0;
            left: 0;
            width: 60px;
            height: 60px;
            pointer-events: none;
        }

        .trail-dot {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(59, 130, 246, 0.8);
            border-radius: 50%;
            animation: fadeOut 0.6s ease-out forwards;
        }

        .trail-dot.red {
            background: rgba(147, 197, 253, 0.8);
        }

        /* Pulsing animation for mouse body */
        @keyframes pulse {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
            }
            50% {
                transform: translate(-50%, -50%) scale(1.05);
            }
        }

        /* Spinning animation */
        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        /* Fade out animation for trail */
        @keyframes fadeOut {
            from {
                opacity: 1;
                transform: scale(1);
            }
            to {
                opacity: 0;
                transform: scale(0);
            }
        }

        /* Eye blink animation */
        @keyframes blink {
            0%, 49%, 100% {
                height: 8px;
            }
            50% {
                height: 1px;
            }
        }

        .eye {
            animation: blink 2s ease-in-out infinite;
        }

        .mouse-body {
            animation: pulse 1.5s ease-in-out infinite;
        }

        /* Tail */
        .tail {
            position: absolute;
            bottom: 15px;
            left: 50%;
            width: 40px;
            height: 8px;
            background: #fff;
            border-radius: 50%;
            transform: translateX(-50%) rotate(-20deg);
            transform-origin: left center;
            animation: swish 0.8s ease-in-out infinite;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        @keyframes swish {
            0%, 100% {
                transform: translateX(-50%) rotate(-20deg);
            }
            50% {
                transform: translateX(-50%) rotate(20deg);
            }
        }

        .info {
            color: white;
            margin-top: 40px;
            font-size: 1.1rem;
            opacity: 0.9;
        }

        /* Chat panel styles */
        .chat-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .chat-header {
            padding: 20px;
            background: rgba(102, 126, 234, 0.2);
            border-bottom: 1px solid rgba(102, 126, 234, 0.3);
        }

        .chat-header h2 {
            color: #667eea;
            font-size: 1.5rem;
            margin: 0;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 80%;
            word-wrap: break-word;
            animation: slideIn 0.3s ease-out;
        }

        .message.system {
            background: rgba(102, 126, 234, 0.1);
            border-left: 3px solid #667eea;
            align-self: flex-start;
        }

        .message.user {
            background: #667eea;
            color: white;
            align-self: flex-end;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
        }

        .chat-input-container {
            padding: 20px;
            background: rgba(102, 126, 234, 0.05);
            border-top: 1px solid rgba(102, 126, 234, 0.2);
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid rgba(102, 126, 234, 0.3);
            border-radius: 10px;
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.3s;
        }

        .chat-input:focus {
            border-color: #667eea;
        }

        .send-button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
        }

        .send-button:hover {
            background: #764ba2;
        }

        .send-button:active {
            transform: scale(0.98);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Custom scrollbar for chat */
        .chat-messages::-webkit-scrollbar {
            width: 8px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: rgba(102, 126, 234, 0.1);
            border-radius: 4px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(102, 126, 234, 0.5);
            border-radius: 4px;
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: rgba(102, 126, 234, 0.7);
        }
    </style>
</head>
<body>
    <div class="left-container">
        <div class="mouse-section">
            <h1>⏳ Busy Mouse</h1>
            <div class="busy-mouse-container">
                <div class="mouse-body">
                    <div class="ear-left"></div>
                    <div class="ear-right"></div>
                    <div class="eye eye-left"></div>
                    <div class="eye eye-right"></div>
                    <div class="nose"></div>
                    <div class="tail"></div>
                </div>
                <div class="busy-indicator"></div>
                <div class="trail"></div>
            </div>
            <p class="info">Processing... Please wait</p>
        </div>
    </div>

    <div class="right-container">
        <div class="chat-panel">
            <div class="chat-header">
                <h2>Chat</h2>
            </div>
            <div class="chat-messages" id="chatMessages">
                <div class="message system">Welcome! I'm here to help you.</div>
                <div class="message system">Feel free to send me a message!</div>
            </div>
            <div class="chat-input-container">
                <input type="text" class="chat-input" id="chatInput" placeholder="Type a message...">
                <button class="send-button" id="sendButton">Send</button>
            </div>
        </div>
    </div>

    <script>
        // Trail effect following a circular path
        const container = document.querySelector('.busy-mouse-container');
        const trail = container.querySelector('.trail');
        const centerX = container.offsetWidth / 2;
        const centerY = container.offsetHeight / 2;
        const radius = 45;
        let angle = 0;
        let dotCount = 0;

        setInterval(() => {
            const x = centerX + radius * Math.cos(angle);
            const y = centerY + radius * Math.sin(angle);

            const dot = document.createElement('div');
            // Alternate between white and red dots
            dot.className = dotCount % 2 === 0 ? 'trail-dot' : 'trail-dot red';
            dot.style.left = x + 'px';
            dot.style.top = y + 'px';
            trail.appendChild(dot);

            // Remove old dots
            const dots = trail.querySelectorAll('.trail-dot');
            if (dots.length > 8) {
                dots[0].remove();
            }

            angle += 0.15;
            dotCount++;
        }, 50);

        // Chat functionality
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const sendButton = document.getElementById('sendButton');

        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function sendMessage() {
            const messageText = chatInput.value.trim();

            if (messageText === '') {
                return;
            }

            // Create user message element
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message user';
            messageDiv.textContent = messageText;

            // Append to chat
            chatMessages.appendChild(messageDiv);

            // Clear input
            chatInput.value = '';

            // Scroll to bottom
            scrollToBottom();
        }

        // Send button click handler
        sendButton.addEventListener('click', sendMessage);

        // Enter key handler
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Initial scroll to show all messages
        scrollToBottom();
    </script>
</body>
</html>
